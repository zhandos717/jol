name: jol

x-service: &service
  build: { context: ., target: runtime }
  restart: unless-stopped
  depends_on:
    nats: { condition: service_healthy }
  environment: &env
    NATS_URL: nats://nats:4222
    LOG_LEVEL: ${LOG_LEVEL:-info}

x-db-service: &db-service
  <<: *service
  depends_on:
    nats: { condition: service_healthy }
    postgres: { condition: service_healthy }

services:
  # ───────────── edge ─────────────
  gateway:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/web:/usr/share/nginx/html:ro
    depends_on: [accounts, fleet, pricing, dispatch, intercity, food, realtime]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
    restart: unless-stopped

  # ───────────── services ─────────────
  accounts:
    <<: *db-service
    build: { context: ., target: runtime, args: { SERVICE: accounts } }
    environment:
      <<: *env
      SERVICE_NAME: accounts
      DB_SCHEMA: accounts
      DATABASE_URL: postgres://accounts:${SERVICE_DB_PASSWORD:-jol_local_dev}@postgres:5432/jol

  fleet:
    <<: *service
    build: { context: ., target: runtime, args: { SERVICE: fleet } }
    environment:
      <<: *env
      SERVICE_NAME: fleet

  pricing:
    <<: *service
    build: { context: ., target: runtime, args: { SERVICE: pricing } }
    environment:
      <<: *env
      SERVICE_NAME: pricing
      OSRM_URL: http://osrm:5000

  dispatch:
    <<: *db-service
    build: { context: ., target: runtime, args: { SERVICE: dispatch } }
    environment:
      <<: *env
      SERVICE_NAME: dispatch
      DB_SCHEMA: dispatch
      DATABASE_URL: postgres://dispatch:${SERVICE_DB_PASSWORD:-jol_local_dev}@postgres:5432/jol

  intercity:
    <<: *db-service
    build: { context: ., target: runtime, args: { SERVICE: intercity } }
    environment:
      <<: *env
      SERVICE_NAME: intercity
      DB_SCHEMA: intercity
      DATABASE_URL: postgres://intercity:${SERVICE_DB_PASSWORD:-jol_local_dev}@postgres:5432/jol
      OSRM_URL: http://osrm:5000

  food:
    <<: *db-service
    build: { context: ., target: runtime, args: { SERVICE: food } }
    environment:
      <<: *env
      SERVICE_NAME: food
      DB_SCHEMA: food
      DATABASE_URL: postgres://food:${SERVICE_DB_PASSWORD:-jol_local_dev}@postgres:5432/jol

  realtime:
    <<: *service
    build: { context: ., target: runtime, args: { SERVICE: realtime } }
    environment:
      <<: *env
      SERVICE_NAME: realtime

  # ───────────── infrastructure ─────────────
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes: ["nats-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jol
      POSTGRES_USER: jol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jol_local_dev}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-jol_local_dev}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jol -d jol"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/kz.osrm
    volumes: ["osrm-data:/data"]
    depends_on:
      osrm-prepare: { condition: service_completed_successfully }
    restart: unless-stopped

  osrm-download:
    image: curlimages/curl:8.11.1
    user: root
    volumes: ["osrm-data:/data"]
    entrypoint: ["sh", "-c"]
    command:
      - '[ -f /data/kz.osrm.mldgr ] || [ -f /data/kz.osm.pbf ] || { curl -fL --retry 3 -o /data/kz.osm.pbf.part "$$OSM_PBF_URL" && mv /data/kz.osm.pbf.part /data/kz.osm.pbf; }'
    environment:
      OSM_PBF_URL: https://download.geofabrik.de/asia/kazakhstan-latest.osm.pbf

  osrm-prepare:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    volumes:
      - osrm-data:/data
      - ./infra/osrm/prepare.sh:/prepare.sh:ro
    entrypoint: ["sh", "/prepare.sh"]
    depends_on:
      osrm-download: { condition: service_completed_successfully }

volumes:
  pg-data:
  nats-data:
  osrm-data:
    name: taxi_osrm-data

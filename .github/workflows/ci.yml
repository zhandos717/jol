name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test

  images:
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        service: [accounts, fleet, pricing, dispatch, intercity, food, realtime, all-in-one]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          build-args: SERVICE=${{ matrix.service }}
          tags: jol-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Restore prepared OSRM map
        id: osrm
        uses: actions/cache@v4
        with:
          path: .osrm-cache
          key: osrm-kz-${{ hashFiles('infra/osrm/prepare.sh') }}
      - name: Seed map volume from cache
        if: steps.osrm.outputs.cache-hit == 'true'
        run: |
          docker volume create taxi_osrm-data
          docker run --rm -v taxi_osrm-data:/data -v "$PWD/.osrm-cache:/cache" alpine sh -c 'cp -a /cache/. /data/'
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 1800
      - name: Save prepared map to cache
        if: steps.osrm.outputs.cache-hit != 'true'
        run: |
          mkdir -p .osrm-cache
          docker run --rm -v taxi_osrm-data:/data -v "$PWD/.osrm-cache:/cache" alpine sh -c 'cp -a /data/. /cache/'
      - run: node scripts/e2e.mjs
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Switch to the lite profile
        run: |
          docker compose down
          docker compose -f docker-compose.lite.yml up -d --build --wait --wait-timeout 300
      - name: End-to-end on the lite profile
        run: node scripts/e2e.mjs
      - name: Lite profile memory
        if: always()
        run: docker stats --no-stream --format '{{.Name}}\t{{.MemUsage}}' | grep jol-lite || true
      - name: Lite logs on failure
        if: failure()
        run: docker compose -f docker-compose.lite.yml logs --no-color --tail=200
